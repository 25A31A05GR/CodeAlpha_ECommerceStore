<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <nav class="navbar">

        <div class="logo">
            🛍️ My Store
        </div>

        <div class="nav-links">

            <a href="index.html">
                🏠 Home
            </a>

            <a href="login.html">
                🔐 Login
            </a>

        </div>

    </nav>


    <div class="form-container">

        <h2>📝 Create Account</h2>

        <form id="registerForm">

            <input
                type="text"
                id="registerName"
                placeholder="Full Name"
                required
            >

            <input
                type="email"
                id="registerEmail"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="registerPassword"
                placeholder="Password (minimum 6 characters)"
                minlength="6"
                required
            >

            <button type="submit">
                Register
            </button>

        </form>

        <p id="registerMessage"></p>

        <p>
            Already have an account?
            <a href="login.html">
                Login
            </a>
        </p>

    </div>


    <script src="script.js"></script>

</body>

</html>
