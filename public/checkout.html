<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            🛍️ My Store
        </div>

        <div class="nav-links">
            <a href="index.html">🏠 Home</a>
        </div>

    </nav>


    <div class="checkout-container">

        <h2>🧾 Checkout</h2>

        <div id="checkoutItems"></div>

        <form id="checkoutForm">

            <input
                type="text"
                id="customerName"
                placeholder="Customer Name"
                required
            >

            <textarea
                id="address"
                placeholder="Delivery Address"
                required
            ></textarea>

            <input
                type="tel"
                id="phone"
                placeholder="Phone Number"
                pattern="[0-9]{10}"
                title="Enter a 10-digit phone number"
                required
            >

            <h3 id="checkoutTotal">
                Total: ₹0
            </h3>

            <button type="submit">
                Place Order
            </button>

        </form>

    </div>


    <script>

        // Get cart
        let cart = JSON.parse(
            localStorage.getItem("cart") || "[]"
        );


        const checkoutItems =
            document.getElementById("checkoutItems");

        const checkoutTotal =
            document.getElementById("checkoutTotal");


        // Show cart
        function displayCheckout() {

            if (cart.length === 0) {

                checkoutItems.innerHTML =
                    "<p>Your cart is empty.</p>";

                checkoutTotal.textContent =
                    "Total: ₹0";

                return;
            }


            let total = 0;
            let output = "";


            cart.forEach((item) => {

                const price = Number(
                    item.price || 0
                );

                const quantity = Number(
                    item.quantity || 1
                );

                const itemTotal =
                    price * quantity;

                total += itemTotal;


                output += `
                    <div class="checkout-item">
                        <p>
                            <strong>${item.name}</strong>
                            × ${quantity}
                            — ₹${itemTotal}
                        </p>
                    </div>
                `;

            });


            checkoutItems.innerHTML = output;

            checkoutTotal.textContent =
                "Total: ₹" + total;


            // Save total temporarily
            localStorage.setItem(
                "checkoutTotal",
                total
            );
        }


        displayCheckout();


        // Place order
        document
            .getElementById("checkoutForm")
            .addEventListener("submit", async function(event) {

                event.preventDefault();


                if (cart.length === 0) {

                    alert("Your cart is empty.");

                    return;
                }


                const customerName =
                    document.getElementById(
                        "customerName"
                    ).value.trim();


                const address =
                    document.getElementById(
                        "address"
                    ).value.trim();


                const phone =
                    document.getElementById(
                        "phone"
                    ).value.trim();


                // Calculate total again
                let total = 0;

                cart.forEach((item) => {

                    total +=
                        Number(item.price || 0) *
                        Number(item.quantity || 1);

                });


                // Get logged-in user
                let userId = null;

                const savedUser =
                    localStorage.getItem("user");

                if (savedUser) {

                    try {

                        const user =
                            JSON.parse(savedUser);

                        userId = user.id || null;

                    } catch (error) {

                        console.log(
                            "User data not found"
                        );

                    }
                }


                // Prepare order items
                const items = cart.map((item) => ({

                    id: Number(
                        item.id || item.productId || 1
                    ),

                    quantity: Number(
                        item.quantity || 1
                    ),

                    price: Number(
                        item.price || 0
                    )

                }));


                try {

                    const response =
                        await fetch("/api/orders", {

                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                userId: userId,

                                customerName:
                                    customerName,

                                address:
                                    address,

                                phone:
                                    phone,

                                items:
                                    items,

                                total:
                                    total
                            })
                        });


                    const data =
                        await response.json();


                    if (!response.ok) {

                        alert(
                            data.message ||
                            "Could not place order."
                        );

                        return;
                    }


                    // Save order information
                    localStorage.setItem(
                        "orderId",
                        data.orderId
                    );

                    localStorage.setItem(
                        "customerName",
                        customerName
                    );

                    localStorage.setItem(
                        "orderTotal",
                        total
                    );


                    // Clear cart
                    localStorage.removeItem(
                        "cart"
                    );


                    // Go to success page
                    window.location.href =
                        "order-success.html" +
                        "?orderId=" +
                        encodeURIComponent(
                            data.orderId
                        ) +
                        "&customerName=" +
                        encodeURIComponent(
                            customerName
                        ) +
                        "&total=" +
                        encodeURIComponent(
                            total
                        );

                } catch (error) {

                    console.error(error);

                    alert(
                        "Server error. Please try again."
                    );
                }

            });

    </script>

</body>

</html>
